appId: dev.brandforge.desktop
productName: BrandForge
copyright: Copyright © 2026 BrandForge contributors · AGPL-3.0

directories:
  output: release

files:
  - dist/**
  - electron/**
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: portable
      arch:
        - x64
        - ia32
  artifactName: BrandForge-${version}-win-${arch}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: BrandForge

mac:
  target:
    - dmg
  category: public.app-category.graphics-design

linux:
  target:
    - AppImage
  category: Graphics
