appId: dev.brandforge.desktop
productName: BrandForge
copyright: Copyright © 2026 BrandForge contributors · AGPL-3.0

directories:
  output: release

files:
  - dist/**
  - electron/**
  - package.json

asar: true

extraResources:
  - from: assets/matting
    to: matting

win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
  artifactName: BrandForge-${version}-win-${arch}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: BrandForge

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.graphics-design
  artifactName: BrandForge-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
  category: Graphics
