name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify version matches tag
        run: node -e "const v=require('./package.json').version,t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(v!==t){console.error('package.json ' + v + ' != tag ' + t);process.exit(1)}console.log('version ' + v + ' ok')"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Fetch matting assets (background-removal model, ~55MB, bundled offline)
        run: npm run matting:assets

      - name: Build renderer
        run: npm run build

      - name: Package app (electron-builder)
        run: npx electron-builder --publish never

      - name: Package portable (Windows only)
        if: runner.os == 'Windows'
        run: npx electron-builder --win -c electron-builder.portable.yml --publish never

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip